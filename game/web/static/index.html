<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What Korea Says</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Bungee&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b1230; --panel:#141d45; --tile:#1d2a66; --gold:#f3b928; --ink:#f4f6ff; --muted:#a9b2d9;
  --red:#ff5a5f; --green:#3ddc97; --ai:#7aa2ff; --line:#2a3878; --dark:#1a1300;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 48px}
header{text-align:center;padding:28px 0 8px}
.logo{font-family:Bungee,sans-serif;font-size:clamp(28px,7vw,48px);color:var(--gold);text-shadow:0 3px 0 #a8770a;margin:0;cursor:pointer}
.tag{color:var(--muted);margin:4px 0 0}
.card{background:var(--panel);border:2px solid var(--gold);border-radius:18px;padding:18px;margin-top:18px}
.meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.pill.g{border-color:var(--gold);color:var(--gold)}
.q{font-size:clamp(20px,5vw,28px);font-weight:800;margin:10px 0 4px}
.hint{color:var(--muted);margin:0 0 12px;font-size:14px}
.board{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.slot{display:flex;align-items:center;gap:10px;background:var(--tile);border-radius:10px;padding:10px 12px;min-height:50px;font-weight:700}
.slot .n{width:28px;height:28px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-family:Bungee,sans-serif;font-size:14px;flex:none}
.slot .l{flex:1;min-width:0;overflow-wrap:anywhere}
.slot .p{font-family:Bungee,sans-serif}
.slot.open{background:var(--gold);color:var(--dark);animation:flip .35s}
.slot.open .n{background:var(--dark);color:var(--gold)}
.slot.late{background:#3a466f}
@keyframes flip{from{transform:rotateX(90deg)}to{transform:none}}
form.row{display:flex;gap:8px}
input,select{font:inherit;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-width:0}
form.row input{flex:1}
button{font:inherit;font-weight:800;padding:11px 18px;border-radius:10px;border:0;background:var(--gold);color:var(--dark);cursor:pointer}
button.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);font-weight:600}
button:disabled{opacity:.5;cursor:wait}
.status{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;min-height:34px;flex-wrap:wrap}
.x{color:var(--red);font-family:Bungee,sans-serif;font-size:24px;letter-spacing:4px}
.msg{color:var(--muted)}
.score{font-family:Bungee,sans-serif;color:var(--gold);font-size:22px}
.about{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0;font-size:14px;color:var(--muted);align-items:center}
.mix{margin:6px 0 14px}
.mixbar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--tile)}
.mixbar .a{background:var(--ai)} .mixbar .h{background:var(--green)}
.mixlbl{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right}
th:nth-child(2),td:nth-child(2){text-align:left}
th{color:var(--muted);font-weight:600;font-size:12px}
td.r{font-family:Bungee,sans-serif;color:var(--gold);text-align:center;width:34px}
.gallup{margin-top:16px;padding-top:12px;border-top:1px dashed var(--line)}
.big{font-family:Bungee,sans-serif;font-size:26px;color:var(--gold)}
.miss{color:var(--muted);font-size:14px}
a{color:var(--ai)}
.mine{background:var(--bg);border-radius:10px;padding:10px 12px;margin:10px 0}
footer{color:var(--muted);font-size:12px;text-align:center;margin-top:24px}
.hidden{display:none}
@media (max-width:560px){.board{grid-template-columns:1fr}}
.lang{display:flex;justify-content:center;gap:6px}
.lang button{padding:5px 12px;font-size:13px}
.lang button.on{border-color:var(--gold);color:var(--gold)}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="lang"><button class="ghost" type="button" data-lang="en">English</button><button class="ghost" type="button" data-lang="ko">한국어</button></div>
  <p class="logo" id="home">WHAT KOREA SAYS</p>
  <p class="tag" data-t="tag"></p>
</header>

<!-- 1. my answer -->
<div class="card hidden" id="s1">
  <div class="meta"><span id="m1"></span><span id="g1"></span></div>
  <p class="q" id="q1"></p>
  <p class="hint" data-t="hint1"></p>
  <form class="row" id="f1" autocomplete="off"><input id="mine" maxlength="40" data-ph="mine"><button data-t="answer"></button></form>
  <div class="about">
    <label><input type="checkbox" id="kr"> <span data-t="kr"></span></label>
    <select id="age"><option value="" data-t="age"></option><option value="10s" data-t="10s"></option><option value="20s" data-t="20s"></option><option value="30s" data-t="30s"></option><option value="40s" data-t="40s"></option><option value="50s" data-t="50s"></option><option value="60+" data-t="60+"></option></select>
    <select id="sex"><option value="" data-t="sex"></option><option value="F" data-t="F"></option><option value="M" data-t="M"></option></select>
    <button class="ghost" type="button" id="skip" data-t="skip"></button>
  </div>
</div>

<!-- 2. guess -->
<div class="card hidden" id="s2">
  <div class="meta"><span id="m2"></span><span><span data-t="score"></span> <b class="score" id="sc">0</b></span></div>
  <p class="q" id="q2"></p>
  <p class="hint" data-t="hint2"></p>
  <div class="board" id="board"></div>
  <form class="row" id="f2" autocomplete="off"><input id="guess" maxlength="40" data-ph="guess"><button id="gb" data-t="guessb"></button></form>
  <div class="status"><span class="x" id="x"></span><span class="msg" id="msg"></span><button class="ghost" type="button" id="give" data-t="give"></button></div>
</div>

<!-- 3. reveal -->
<div class="card hidden" id="s3">
  <div class="meta"><span id="m3"></span><span><span data-t="score"></span> <b class="score" id="sc3">0</b></span></div>
  <p class="q" id="q3"></p>
  <div class="mix">
    <div class="mixbar"><div class="a" id="mixa"></div><div class="h" id="mixh"></div></div>
    <div class="mixlbl"><span id="mixal"></span><span id="mixhl"></span></div>
  </div>
  <p class="miss" id="explain"></p>
  <div class="mine" id="mineBox"></div>
  <table><thead><tr><th></th><th data-t="thA"></th><th data-t="thB"></th><th data-t="thAI"></th><th id="gth" data-t="thG"></th></tr></thead><tbody id="rows"></tbody></table>
  <div class="gallup hidden" id="gal"></div>
  <div class="status"><span class="msg" data-t="how"></span><button id="next" data-t="next"></button></div>
</div>

<!-- 4. all done -->
<div class="card hidden" id="s4">
  <p class="q" data-t="alldone"></p>
  <p class="hint" data-t="alldone2"></p>
  <div class="status"><span></span><button class="ghost" type="button" id="again" data-t="again"></button></div>
</div>

<footer data-t="foot"></footer>
</div>

<script>
const $ = id => document.getElementById(id);
const store = {get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d } catch { return d } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch {} }};
const api = async (path, body) => {
  const r = await fetch("api" + path, body ? {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)} : {});
  if (!r.ok) throw new Error(await r.text());
  return r.json();
};
const T = {
  en: {
    tag: "AI guessed first. Real people are correcting it. Can you read Korea's mind?",
    hint1: "First, <b>your own answer</b>. If you live in Korea, it's added to the board after your round — for the next players.",
    mine: "Your answer (English or 한국어)", answer: "Answer", kr: "I live in Korea",
    age: "Age", "10s": "10s", "20s": "20s", "30s": "30s", "40s": "40s", "50s": "50s", "60+": "60+",
    sex: "Gender", F: "Female", M: "Male", X: "Other", skip: "Skip", score: "Score",
    hint2: "Name the most popular answers in Korea. Three strikes and you're out.",
    guess: "Your guess", guessb: "Guess", give: "Reveal board",
    thA: "Answer", thB: "Board", thAI: "AI guess", thG: "Gallup (ref.)",
    how: "AI guess = NVIDIA Nemotron on Nebius Token Factory. Board = AI guess updated by players (Bayesian).",
    next: "Next question →",
    alldone: "You've played all 30 questions. Thank you!",
    alldone2: "Your answers are already on the boards. Share the link so more people can correct the AI.",
    again: "Play them again",
    foot: "Real survey data: Gallup Korea \"What Koreans Like\" 2024, Gallup Korea 2026 · Answers from people outside Korea are saved but not counted · Prototype",
    meta: (n, a) => `${n} player${n === 1 ? "" : "s"} so far · AI ${a}%`,
    meta3: (n, k) => `${n} player${n === 1 ? "" : "s"} · AI counts as ${k} people`,
    real: "survey to compare", aionly: "AI + players only",
    top: r => `Top answer #${r}!`, already: "Already on the board", notOn: t => `"${t}" is not on the board`,
    mixA: a => `AI guess ${a}%`, mixH: h => `Players ${h}%`,
    skipped: "You skipped your own answer.",
    mineOn: (l, r) => `Your answer <b>${l}</b> is <b>#${r}</b> on the board.`,
    mineOff: (l, c) => c > 1 ? `Your answer <b>${l}</b> isn't on the board yet (${c} players said it). A few more and it climbs on.` : `Your answer <b>${l}</b> is new — nobody else has said it yet. One more player saying it makes it a board candidate.`,
    listed: "no %", judging: "Checking…", oops: "Server hiccup — please try again.",
    check: (name, sample) => `<b>Reference, not the answer key:</b> ${name} asked ${sample}. Gallup publishes only its top answers with percentages, so it is a yardstick — '–' means not in Gallup's published list, not that nobody said it.`,
    match: (a, n) => `Similarity to Gallup — AI alone <span class="big">${a}</span> → board now <span class="big">${n}</span> <span class="miss">(1.00 = identical)</span>`,
    ex: "The AI (Nemotron) made the first board. Every answer from someone in Korea pulls it toward what people really say — the bar shows how much is AI vs players now.",
    exG: " Gallup asked this one too, so below you can see how close the board is to that survey — a reference point, not the right answer.",
    exN: " No real survey exists for this one — players' answers become the truth.",
    missing: "Gallup answers not on the board: ", src: "Source", pct: "% among people who gave an answer",
  },
  ko: {
    tag: "AI가 먼저 추측했고, 진짜 사람들이 고쳐 가는 중. 한국인의 마음을 맞혀 보세요!",
    hint1: "먼저 <b>내 답</b>을 적어 주세요. 한국에 살고 있다면, 판이 끝난 뒤 다음 사람을 위한 정답판에 더해져요.",
    mine: "내 답 (한국어로 적어도 돼요)", answer: "답하기", kr: "한국에 살아요",
    age: "나이", "10s": "10대", "20s": "20대", "30s": "30대", "40s": "40대", "50s": "50대", "60+": "60대 이상",
    sex: "성별", F: "여성", M: "남성", X: "기타", skip: "건너뛰기", score: "점수",
    hint2: "한국인이 가장 많이 한 답을 맞혀 보세요. 세 번 틀리면 끝!",
    guess: "추측해 보세요", guessb: "맞히기", give: "정답판 보기",
    thA: "답", thB: "정답판", thAI: "AI 추측", thG: "갤럽(참고)",
    how: "AI 추측 = Nebius Token Factory의 NVIDIA Nemotron. 정답판 = 플레이어 답으로 고쳐 가는 AI 추측(베이즈).",
    next: "다음 문제 →",
    alldone: "30문제를 다 풀었어요. 고마워요!",
    alldone2: "내 답은 이미 정답판에 들어갔어요. 링크를 주변에 공유해 주시면 AI를 더 많이 고칠 수 있어요.",
    again: "처음부터 다시 풀기",
    foot: "실제 조사: 한국갤럽 '한국인이 좋아하는 것' 2024, 한국갤럽 2026 · 한국 밖에 사는 분의 답은 저장만 하고 세지 않아요 · 프로토타입",
    meta: (n, a) => `지금까지 ${n}명 참여 · AI ${a}%`,
    meta3: (n, k) => `${n}명 참여 · AI는 ${k}명 몫`,
    real: "조사와 비교 가능", aionly: "AI + 플레이어만",
    top: r => `${r}위 정답!`, already: "이미 열린 답이에요", notOn: t => `"${t}" → 정답판에 없어요`,
    mixA: a => `AI 추측 ${a}%`, mixH: h => `플레이어 ${h}%`,
    skipped: "내 답은 건너뛰었어요.",
    mineOn: (l, r) => `내 답 <b>${l}</b> → 정답판 <b>${r}위</b>`,
    mineOff: (l, c) => c > 1 ? `내 답 <b>${l}</b> → 아직 정답판에 없어요 (나 포함 ${c}명). 몇 명 더 같은 답을 하면 올라가요.` : `내 답 <b>${l}</b> → 처음 나온 답이에요. 한 명만 더 같은 답을 하면 정답판 후보가 돼요.`,
    listed: "% 없음", judging: "채점 중…", oops: "잠깐 오류가 났어요. 다시 눌러 주세요.",
    check: (name, sample) => `<b>정답이 아니라 참고 자료예요:</b> ${name} (${sample}). 갤럽은 상위 답만 %와 함께 공개해서, '–'는 아무도 안 했다는 게 아니라 공개 목록에 없다는 뜻이에요.`,
    match: (a, n) => `갤럽과 비슷한 정도 — AI만 <span class="big">${a}</span> → 지금 정답판 <span class="big">${n}</span> <span class="miss">(1.00 = 똑같음)</span>`,
    ex: "처음 정답판은 AI(Nemotron)가 추측해 만들었어요. 한국에 사는 사람이 답할 때마다 진짜 답 쪽으로 바뀌어요. 위 막대는 지금 정답판에서 AI와 사람이 각각 차지하는 비중이에요.",
    exG: " 이 문제는 갤럽도 물어봐서, 아래에서 정답판이 그 조사와 얼마나 비슷한지 볼 수 있어요. 맞고 틀림이 아니라 참고용 비교예요.",
    exN: " 이 문제는 실제 조사가 없어서, 사람들의 답이 곧 정답이 돼요.",
    missing: "정답판에 없는 갤럽 답: ", src: "출처", pct: "응답한 사람 중 %",
  },
};
// 기본 영어(심사용). 한국 플레이어 링크는 ?lang=ko
const urlLang = new URLSearchParams(location.search).get("lang");
let L = ["ko", "en"].includes(urlLang) ? urlLang : store.get("lang", null) || "en";   // 심사 기간 기본 영어(?lang=ko 로 한국어)
const t = k => T[L][k];
const lbl = s => L === "ko" ? (s.ko || s.label) : s.label;
let Q = [], cur = null, info = null, mine = null, opened = {}, strikes = 0, score = 0, busy = false, finished = false, last = null;

function applyLang() {
  document.documentElement.lang = L;
  document.querySelectorAll("[data-t]").forEach(e => e.innerHTML = t(e.dataset.t));
  document.querySelectorAll("[data-ph]").forEach(e => e.placeholder = t(e.dataset.ph));
  document.querySelectorAll("[data-lang]").forEach(b => b.classList.toggle("on", b.dataset.lang === L));
  if (!info) return;
  $("q1").textContent = $("q2").textContent = $("q3").textContent = L === "ko" ? info.q_ko : info.q;
  $("m1").textContent = $("m2").textContent = metaText();
  $("g1").innerHTML = info.gallup ? `<span class="pill g">${t("real")}</span>` : `<span class="pill">${t("aionly")}</span>`;
  if (!$("s2").classList.contains("hidden")) renderBoard();
  if (last && !$("s3").classList.contains("hidden")) renderReveal(last);
}
document.querySelectorAll("[data-lang]").forEach(b => b.onclick = () => { L = b.dataset.lang; store.set("lang", L); applyLang(); });

function show(id) { ["s1", "s2", "s3", "s4"].forEach(s => $(s).classList.toggle("hidden", s !== id)); }
// 본 문제는 메모리에도 둠(카톡 등 인앱 브라우저에서 localStorage가 막히면 매번 처음부터라 같은 문제가 반복됨)
const seen = new Set(store.get("played", []));
function pick() {
  let pool = Q.filter(q => !seen.has(q.id));
  return pool.length ? pool[Math.floor(Math.random() * pool.length)] : null;   // 다 풀었으면 같은 문제를 다시 내지 않고 끝 화면
}
function metaText() { return t("meta")(info.n, Math.round(100 * info.ai_weight)); }

async function start(q) {
  const nx = q || pick();
  if (!nx) { show("s4"); return; }
  cur = nx; mine = null; opened = {}; strikes = 0; score = 0; finished = false; last = null;
  seen.add(cur.id); store.set("played", [...seen]);   // 화면에 띄우는 순간 본 것으로(끝까지 안 해도 다시 안 나옴)
  info = await api(`/q/${cur.id}`);
  applyLang();
  $("mine").value = ""; show("s1"); $("mine").focus();
}
async function toGuess() {
  info = await api(`/q/${cur.id}`);
  applyLang();
  renderBoard(); $("x").textContent = ""; $("msg").textContent = ""; $("sc").textContent = "0";
  show("s2"); $("guess").focus();
  if (mine) doGuess(mine.text, true);   // 내 답을 첫 추측으로 바로 넣음(같은 단어 다시 쓰지 않게)
}
function renderBoard(final) {
  $("board").innerHTML = Array.from({length: info.slots}, (_, i) => {
    const o = opened[i], f = final && final[i];
    const cls = o ? "open" : f ? "late" : "";
    const s = o || f;
    return `<div class="slot ${cls}"><span class="n">${i + 1}</span><span class="l">${s ? esc(lbl(s)) : ""}</span><span class="p">${s ? Math.round(s.now) : ""}</span></div>`;
  }).join("");
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));

$("f1").onsubmit = async e => {
  e.preventDefault();
  const t = $("mine").value.trim(); if (!t || busy) return;
  busy = true;
  // 내 답은 판이 끝난 뒤 저장(내가 맞힐 정답판에 내 답이 들어가 힌트가 되지 않게)
  mine = {text: t, kr: $("kr").checked, age: $("age").value || null, sex: $("sex").value || null};
  store.set("about", {kr: mine.kr, age: mine.age, sex: mine.sex});
  busy = false;
  toGuess();
};
$("skip").onclick = () => toGuess();

$("f2").onsubmit = e => { e.preventDefault(); doGuess($("guess").value.trim()); };
async function doGuess(g, own) {
  if (!g || busy) return;
  busy = true; $("gb").disabled = true; $("guess").value = ""; $("msg").textContent = t("judging");
  try {
    const r = await api(`/q/${cur.id}/guess`, {text: g, nth: strikes + Object.keys(opened).length + 1, own: !!own});
    if (r.rank >= 0 && !opened[r.rank]) {
      opened[r.rank] = r; score += Math.round(r.now);
      $("msg").textContent = t("top")(r.rank + 1); $("sc").textContent = score;
      renderBoard();
      if (Object.keys(opened).length === info.slots) return finish();
    } else {
      strikes++; $("x").textContent = "✕".repeat(strikes);
      $("msg").textContent = r.rank >= 0 ? t("already") : t("notOn")(g);
      if (strikes >= 3) return finish();
    }
  } catch { $("msg").textContent = t("oops"); $("guess").value = g; }   // 서버 오류면 안내하고 글자 돌려줌(버튼이 안 먹는 것처럼 보이지 않게)
  finally { busy = false; $("gb").disabled = false; $("guess").focus(); }
}
$("give").onclick = () => finish();

async function finish() {
  if (finished) return;
  finished = true;   // 한 판에 한 번만(정답판 다 열기·세 번째 X가 겹쳐도 내 답이 두 번 저장되지 않게)
  let key, r;
  try {
    key = mine ? (await api(`/q/${cur.id}/answer`, mine)).key : null;
    r = await api(`/q/${cur.id}/reveal${key ? "?mine=" + encodeURIComponent(key) : ""}`);
  } catch { finished = false; $("msg").textContent = t("oops"); return; }   // 다시 누를 수 있게
  // 내 답이 더해져 순위가 바뀔 수 있으니 맞힌 칸을 key로 다시 찾음(번호로 찾으면 다른 칸에 ✓)
  const hit = new Set(Object.values(opened).map(o => o.key));
  opened = {}; r.board.forEach((s, i) => { if (hit.has(s.key)) opened[i] = s; });
  renderBoard(r.board);
  await new Promise(res => setTimeout(res, 900));
  last = r;
  renderReveal(r);
  show("s3");
}
function renderReveal(r) {
  $("m3").textContent = t("meta3")(r.n, r.kappa);
  $("sc3").textContent = score;
  const a = Math.round(100 * r.ai_weight);
  $("mixa").style.width = a + "%"; $("mixh").style.width = (100 - a) + "%";
  $("mixal").textContent = t("mixA")(a); $("mixhl").textContent = t("mixH")(100 - a);
  $("explain").textContent = t("ex") + t(r.gallup ? "exG" : "exN");
  const m = r.mine;
  $("mineBox").innerHTML = !m ? t("skipped") :
    m.rank >= 0 ? t("mineOn")(esc(lbl(m)), m.rank + 1) : t("mineOff")(esc(lbl(m)), m.count);
  $("gth").classList.toggle("hidden", !r.gallup);
  $("rows").innerHTML = r.board.map((s, i) => `<tr><td class="r">${i + 1}</td><td>${esc(lbl(s))}${opened[i] ? " ✓" : ""}</td><td><b>${Math.round(s.now)}</b></td><td>${Math.round(s.ai)}</td>${r.gallup ? `<td>${s.gallup == null ? "–" : s.gallup === "n/a" ? t("listed") : Math.round(s.gallup)}</td>` : ""}</tr>`).join("");
  if (r.gallup) {
    const missed = r.gallup.items.filter(x => !x.on_board).slice(0, 4);
    $("gal").innerHTML = `<p>${t("check")(esc(r.gallup.name), esc(r.gallup.sample))}</p>
      <p>${t("match")(r.gallup.overlap_ai.toFixed(2), r.gallup.overlap_now.toFixed(2))}</p>
      ${missed.length ? `<p class="miss">${t("missing")}${missed.map(x => `${esc(lbl(x))} ${Math.round(x.pct)}%`).join(", ")}</p>` : ""}
      <p class="miss"><a href="${esc(r.gallup.url)}" target="_blank" rel="noopener">${t("src")}</a> · ${t("pct")}</p>`;
    $("gal").classList.remove("hidden");
  } else $("gal").classList.add("hidden");
}
$("next").onclick = () => start();
$("home").onclick = () => start();
$("again").onclick = () => { seen.clear(); store.set("played", []); start(); };

(async () => {
  applyLang();
  const about = store.get("about", {});
  $("kr").checked = !!about.kr; $("age").value = about.age || ""; $("sex").value = about.sex || "";
  Q = await api("/questions");
  Q.forEach(q => q.done && seen.add(q.id));   // 서버가 기억하는 이미 답한 문제(새로고침·기록 삭제에도)
  start();
})();
</script>
